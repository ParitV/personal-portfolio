name: Security Scans

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 7

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --sarif --output semgrep-results.sarif .
        continue-on-error: true

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 7

  zap-dast:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start vite preview
        run: nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 & disown

      - name: Wait for preview server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:4173/ > /dev/null; then
              echo "preview server is up"
              exit 0
            fi
            echo "Waiting for preview server... (attempt $i)"
            sleep 2
          done
          echo "preview server did not become ready in time"
          cat preview.log
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:4173"
          cmd_options: "-J report_json.json"
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP report artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 7

  report:
    name: Aggregate Findings & Comment on PR
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, zap-dast]
    if: ${{ github.event_name == 'pull_request' && success() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CodeQL SARIF
        uses: actions/download-artifact@v4
        with:
          name: codeql-sarif
          path: artifacts/codeql

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        with:
          name: semgrep-sarif
          path: artifacts/semgrep

      - name: Download ZAP report
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: artifacts/zap

      - name: Aggregate findings & comment on PR
        uses: ParitV/Eight@v1
        with:
          codeql-sarif: artifacts/codeql/javascript-typescript.sarif
          semgrep-sarif: artifacts/semgrep/semgrep-results.sarif
          zap-json: artifacts/zap/report_json.json
          report-path: report.md
