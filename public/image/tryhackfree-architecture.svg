  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="Segoe UI, sans-serif" font-size="11">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b423d"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f6b52"/></marker>
    </defs>
    <!-- browser -->
    <rect x="20" y="20" width="170" height="70" rx="6" fill="#faf7f2" stroke="#3b423d"/>
    <text x="105" y="47" text-anchor="middle" font-weight="600">Your browser</text>
    <text x="105" y="65" text-anchor="middle" fill="#69716b">React UI + xterm.js</text>
    <text x="105" y="80" text-anchor="middle" fill="#69716b">http://localhost:8080</text>
    <!-- control plane box -->
    <rect x="230" y="10" width="510" height="220" rx="8" fill="#e3eae1" stroke="#4f6b52" stroke-dasharray="5 3"/>
    <text x="245" y="30" font-weight="700" fill="#3f5842">CONTROL PLANE (trusted, docker compose)</text>
    <rect x="250" y="45" width="135" height="60" rx="5" fill="#fff" stroke="#4f6b52"/>
    <text x="317" y="68" text-anchor="middle" font-weight="600">frontend</text>
    <text x="317" y="84" text-anchor="middle" fill="#69716b">nginx (static UI)</text>
    <text x="317" y="97" text-anchor="middle" fill="#69716b">proxies /api + WS</text>
    <rect x="420" y="45" width="140" height="60" rx="5" fill="#fff" stroke="#4f6b52"/>
    <text x="490" y="68" text-anchor="middle" font-weight="600">backend</text>
    <text x="490" y="84" text-anchor="middle" fill="#69716b">FastAPI (Python)</text>
    <text x="490" y="97" text-anchor="middle" fill="#69716b">orchestrator + relay</text>
    <rect x="595" y="45" width="130" height="30" rx="5" fill="#fff" stroke="#4f6b52"/>
    <text x="660" y="64" text-anchor="middle">PostgreSQL</text>
    <rect x="595" y="85" width="130" height="30" rx="5" fill="#fff" stroke="#4f6b52"/>
    <text x="660" y="104" text-anchor="middle">Redis</text>
    <rect x="420" y="150" width="140" height="60" rx="5" fill="#efe4d6" stroke="#8a6a4a"/>
    <text x="490" y="173" text-anchor="middle" font-weight="600">docker-proxy</text>
    <text x="490" y="189" text-anchor="middle" fill="#69716b">filtered Docker API</text>
    <text x="490" y="202" text-anchor="middle" fill="#69716b">(no exec, no volumes)</text>
    <!-- arrows control -->
    <line x1="190" y1="55" x2="248" y2="70" stroke="#3b423d" marker-end="url(#a)"/>
    <text x="105" y="108" text-anchor="middle" fill="#69716b" font-size="9.5">HTTP + WebSocket &#8594;</text>
    <line x1="385" y1="75" x2="418" y2="75" stroke="#3b423d" marker-end="url(#a)"/>
    <line x1="560" y1="62" x2="593" y2="60" stroke="#3b423d" marker-end="url(#a)"/>
    <line x1="560" y1="90" x2="593" y2="99" stroke="#3b423d" marker-end="url(#a)"/>
    <line x1="490" y1="105" x2="490" y2="148" stroke="#8a6a4a" marker-end="url(#a)"/>
    <text x="498" y="132" fill="#8a6a4a" font-size="9.5">Engine API (tcp, internal network)</text>
    <!-- docker engine -->
    <rect x="230" y="250" width="510" height="44" rx="6" fill="#16191a"/>
    <text x="485" y="277" text-anchor="middle" fill="#d7dcd6" font-weight="600">Docker Engine (Linux)  -  /var/run/docker.sock mounted read-only into docker-proxy only</text>
    <line x1="490" y1="210" x2="490" y2="248" stroke="#8a6a4a" marker-end="url(#a)"/>
    <!-- data plane -->
    <rect x="20" y="315" width="720" height="145" rx="8" fill="#f7dedb" stroke="#9b2c22" stroke-dasharray="5 3"/>
    <text x="35" y="335" font-weight="700" fill="#9b2c22">DATA PLANE (hostile, created at runtime)</text>
    <rect x="40" y="348" width="320" height="100" rx="6" fill="#fff" stroke="#9b2c22"/>
    <text x="55" y="366" font-weight="600">Lab instance A  -  network 10.20.1.0/24 (internal)</text>
    <rect x="55" y="378" width="130" height="55" rx="5" fill="#16191a"/><text x="120" y="400" text-anchor="middle" fill="#d7dcd6" font-weight="600">attackbox</text><text x="120" y="417" text-anchor="middle" fill="#9aa39b" font-size="9.5">bash on a TTY</text>
    <rect x="210" y="378" width="130" height="55" rx="5" fill="#efe4d6" stroke="#8a6a4a"/><text x="275" y="400" text-anchor="middle" font-weight="600">portal</text><text x="275" y="417" text-anchor="middle" fill="#69716b" font-size="9.5">vulnerable target</text>
    <line x1="185" y1="405" x2="208" y2="405" stroke="#3b423d" marker-end="url(#a)"/>
    <rect x="400" y="348" width="320" height="100" rx="6" fill="#fff" stroke="#9b2c22"/>
    <text x="415" y="366" font-weight="600">Lab instance B  -  network 10.20.2.0/24 (internal)</text>
    <rect x="415" y="378" width="130" height="55" rx="5" fill="#16191a"/><text x="480" y="400" text-anchor="middle" fill="#d7dcd6" font-weight="600">attackbox</text>
    <rect x="570" y="378" width="130" height="55" rx="5" fill="#efe4d6" stroke="#8a6a4a"/><text x="635" y="400" text-anchor="middle" font-weight="600">target(s)</text>
    <line x1="365" y1="398" x2="395" y2="398" stroke="#9b2c22" stroke-width="2"/><text x="380" y="392" text-anchor="middle" fill="#9b2c22" font-weight="700" font-size="14">&#x2715;</text>
    <line x1="490" y1="294" x2="490" y2="313" stroke="#8a6a4a" marker-end="url(#a)"/>
    <text x="500" y="307" fill="#8a6a4a" font-size="9.5">creates / attaches / removes</text>
  </svg>
